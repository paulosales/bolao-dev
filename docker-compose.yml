services:
  mysql:
    image: mysql:8.0
    container_name: bolao_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: bolao_copa
      MYSQL_USER: bolao
      MYSQL_PASSWORD: bolao123
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../bolao-backend/database/migrations/001_create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql
      - ../bolao-backend/database/seeds/001_teams.sql:/docker-entrypoint-initdb.d/02_teams.sql
      - ../bolao-backend/database/seeds/002_matches.sql:/docker-entrypoint-initdb.d/03_matches.sql
    networks:
      - bolao_net

  backend:
    env_file:
      - ../bolao-backend/.env
    build: ../bolao-backend
    container_name: bolao_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../bolao-backend:/var/www/html
    ports:
      - "8080:80"
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    networks:
      - bolao_net

  frontend:
    env_file:
      - ../bolao-frontend/.env
    image: node:20-alpine
    container_name: bolao_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../bolao-frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    # environment vars come from env_file above
    networks:
      - bolao_net

volumes:
  mysql_data:

networks:
  bolao_net:
    driver: bridge
